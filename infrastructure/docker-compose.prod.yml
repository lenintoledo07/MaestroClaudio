# Maestro Claudio · producción (Hetzner VPS)
#
# Uso:
#   docker compose -f infrastructure/docker-compose.prod.yml up -d --build
#
# Postgres NO está incluido: se usa la instancia que ya corre en el VPS.
# DATABASE_URL en .env.production debe apuntar a esa instancia. Si Postgres
# escucha en el host, `host.docker.internal` (mapeado a `host-gateway`) permite
# alcanzarlo desde dentro de los contenedores en Linux.

services:
  maestro-api:
    container_name: maestro-api
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: maestro-claudio-backend:latest
    ports:
      - "8001:8001"
    volumes:
      - ../audio:/app/audio
    env_file: ../.env.production
    command: uvicorn main:app --host 0.0.0.0 --port 8001
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always
    depends_on:
      - redis

  maestro-worker:
    container_name: maestro-worker
    image: maestro-claudio-backend:latest
    volumes:
      - ../audio:/app/audio
    env_file: ../.env.production
    # PYTHONPATH=/app — sin esto, lazy imports de services.* dentro de las tasks
    # fallan con ModuleNotFoundError (sys.path[0] queda en /usr/local/bin).
    environment:
      PYTHONPATH: /app
    command: celery -A workers.celery_app worker --loglevel=info --concurrency=2
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always
    depends_on:
      - redis
      - maestro-api

  maestro-mcp:
    container_name: maestro-mcp
    build:
      context: ../mcp
      dockerfile: Dockerfile
    image: maestro-claudio-mcp:latest
    ports:
      - "8002:8002"
    env_file: ../.env.production
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

  redis:
    container_name: maestro-redis
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: always
    command: ["redis-server", "--appendonly", "yes"]

volumes:
  redis_data:
