services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: maestro
      POSTGRES_PASSWORD: maestro
      POSTGRES_DB: maestro_claudio
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maestro -d maestro_claudio"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
    env_file: ../.env
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://maestro:maestro@postgres:5432/maestro_claudio
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
    command: celery -A workers.celery_app worker --loglevel=info
    env_file: ../.env
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://maestro:maestro@postgres:5432/maestro_claudio
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ../backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  mcp:
    build:
      context: ../mcp
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://maestro:maestro@postgres:5432/maestro_claudio
    ports:
      - "8765:8765"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
