# Maestro Claudio · entorno de desarrollo (Mac local)
#
# Uso:
#   docker compose -f infrastructure/docker-compose.dev.yml up --build
#
# Las rutas relativas (../backend, ../audio, ./migrations) se resuelven contra
# la ubicación de ESTE archivo, no contra la cwd desde la que se invoca.
#
# Restricciones de recursos: la Mac de desarrollo tiene 4 GB de RAM compartidos
# entre todos los servicios → worker con concurrency=1.

services:
  maestro-api:
    container_name: maestro-api
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
    ports:
      - "8001:8001"
    volumes:
      - ../backend:/app           # hot reload del código fuente
      - ../audio:/app/audio       # archivos de audio descargados/transcritos
    env_file: ../.env.local
    command: uvicorn main:app --reload --host 0.0.0.0 --port 8001
    depends_on:
      redis:
        condition: service_started
      postgres-dev:
        condition: service_healthy

  maestro-worker:
    container_name: maestro-worker
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
    volumes:
      - ../backend:/app
      - /tmp:/tmp                 # archivos temporales compartidos con el host
      - ../audio:/app/audio
    env_file: ../.env.local
    # PYTHONPATH=/app: el script `celery` corre como `python /usr/local/bin/celery`,
    # entonces sys.path[0] queda en /usr/local/bin y NO /app — el lazy import de
    # `services.*` adentro de las tasks falla. PYTHONPATH lo soluciona en runtime
    # sin tener que tocar el código de las tasks.
    environment:
      PYTHONPATH: /app
    command: celery -A workers.celery_app worker --loglevel=info --concurrency=1
    depends_on:
      redis:
        condition: service_started
      postgres-dev:
        condition: service_healthy

  maestro-mcp:
    container_name: maestro-mcp
    build:
      context: ../mcp
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    volumes:
      - ../mcp:/app                # hot reload manual con docker restart
    env_file: ../.env.local
    # En dev no hay reload nativo de FastMCP; reiniciás con
    # `docker restart maestro-mcp` después de cambios en server.py.
    depends_on:
      postgres-dev:
        condition: service_healthy

  redis:
    container_name: maestro-redis
    image: redis:7-alpine
    ports:
      # 6380 en host para no chocar con otros Redis (cryptohunter, brew, etc).
      # El backend dentro del compose habla con `redis://redis:6379/0`
      # (hostname del servicio, puerto interno del container).
      - "6380:6379"

  postgres-dev:
    container_name: maestro-postgres-dev
    image: pgvector/pgvector:pg15
    ports:
      - "5433:5432"               # 5433 en host para no chocar con otros Postgres
    environment:
      POSTGRES_DB: maestro_claudio_dev
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d maestro_claudio_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata_dev:
