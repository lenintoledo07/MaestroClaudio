name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/maestro-claudio
            git pull origin main
            docker-compose -f infrastructure/docker-compose.prod.yml up -d --build maestro-api maestro-worker maestro-mcp
            docker image prune -f

  notify:
    runs-on: ubuntu-latest
    needs: deploy-backend
    if: always()
    steps:
      - name: Send WhatsApp notification
        env:
          WA_PHONE_ID: ${{ secrets.WA_PHONE_ID }}
          WA_TOKEN: ${{ secrets.WA_TOKEN }}
          WA_MY_NUMBER: ${{ secrets.WA_MY_NUMBER }}
          META_API_VERSION: ${{ vars.META_API_VERSION }}
          DEPLOY_RESULT: ${{ needs.deploy-backend.result }}
        run: |
          if [ "$DEPLOY_RESULT" = "success" ]; then
            MESSAGE="✅ Maestro Claudio actualizado correctamente"
          else
            MESSAGE="❌ Error en el deploy. Revisar GitHub Actions."
          fi

          curl -X POST "https://graph.facebook.com/${META_API_VERSION:-v21.0}/${WA_PHONE_ID}/messages" \
            -H "Authorization: Bearer ${WA_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{
              \"messaging_product\": \"whatsapp\",
              \"to\": \"${WA_MY_NUMBER}\",
              \"type\": \"text\",
              \"text\": { \"body\": \"${MESSAGE}\" }
            }"
