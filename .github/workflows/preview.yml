name: Preview

# El frontend lo despliega Vercel automáticamente desde la rama develop.
# Aquí solo validamos que los requirements de Python (backend y MCP) instalen
# limpio y no haya conflictos de dependencias. Cada componente corre en su
# propio job/venv para que un conflicto en uno no contamine al otro.

on:
  push:
    branches: [develop]

jobs:
  pip-check:
    name: pip check · ${{ matrix.component }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [backend, mcp]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ matrix.component }}/requirements.txt

      - name: Install dependencies
        run: pip install -r ${{ matrix.component }}/requirements.txt

      - name: pip check
        run: pip check
